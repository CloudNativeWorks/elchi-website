name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history: sitemap <lastmod> and the docs' "last updated" dates come from git
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            docs-site/package-lock.json

      - name: Build marketing site (Vite)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build

      - name: Build docs (Docusaurus)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      - name: Merge outputs (docs under /docs/)
        run: |
          rm -rf dist/docs
          mv docs-site/build dist/docs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Tell IndexNow engines (Bing, Yandex, Seznam, Naver…) which URLs changed: those whose
      # sitemap <lastmod> (from git) is today. Bing's index also feeds Copilot and ChatGPT
      # search. Key file: public/2495e897fc8278a147b89e6d790e8689.txt. Best-effort: never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re, datetime, urllib.request
          today = datetime.date.today().isoformat()
          urls = []
          for f in ('dist/sitemap.xml', 'dist/docs/sitemap.xml'):
              for block in re.findall(r'<url>(.*?)</url>', open(f).read(), re.S):
                  loc = re.search(r'<loc>([^<]+)', block).group(1)
                  mod = re.search(r'<lastmod>([^<]+)', block)
                  if mod and mod.group(1)[:10] >= today:
                      urls.append(loc)
          print(f'{len(urls)} changed URL(s)')
          if urls:
              body = json.dumps({'host': 'www.elchi.io', 'key': '2495e897fc8278a147b89e6d790e8689',
                                 'keyLocation': 'https://www.elchi.io/2495e897fc8278a147b89e6d790e8689.txt', 'urlList': urls}).encode()
              req = urllib.request.Request('https://api.indexnow.org/indexnow', data=body,
                                           headers={'Content-Type': 'application/json; charset=utf-8'})
              print('IndexNow HTTP', urllib.request.urlopen(req, timeout=30).status)
          PY
